apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  type: NodePort  # ← Изменено на NodePort
  selector:
    app: myapp
  ports:
  - name: http
    port: 80
    targetPort: 5000
    nodePort: 30000  # ← Фиксированный порт

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
